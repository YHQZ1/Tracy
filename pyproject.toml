[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tracy"
version = "0.1.0"
description = "A headless AI companion for Moodle course data, documents, and reminders."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tracy contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
ai = [
  "anthropic>=0.49,<1",
  "langgraph>=0.3,<1",
  "openai>=1.66,<2",
]
documents = [
  "pymupdf>=1.25,<2",
]
persistence = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
tracy = "tracy.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
